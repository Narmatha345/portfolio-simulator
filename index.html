    <!-- GitHub Pages SPA routing fix - https://github.com/rafgraph/spa-github-pages -->
    <script type="text/javascript">
      // Decode the redirect from 404.html and restore clean URL
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
